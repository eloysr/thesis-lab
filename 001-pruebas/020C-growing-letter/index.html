<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Growing Letter</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="control-panel">
      <div class="panel-header">
        <h1>GROWING LETTERS</h1>
      </div>

      <div class="control-section">
        <label for="letterInput">Text:</label>
        <textarea id="letterInput" rows="3" class="letter-input" placeholder="Write a word, phrase or paragraph">A</textarea>
      </div>

      <div class="control-section">
        <label for="fontSizeSlider">Font Size:</label>
        <div class="slider-container">
          <input type="range" id="fontSizeSlider" min="40" max="800" step="10" value="160" class="slider">
          <span id="fontSizeValue">160</span>
        </div>
      </div>

      <div class="control-section">
        <label>Mode:</label>
        <div class="mode-buttons">
          <button id="modeSound" class="mode-btn active" data-mode="sound">Sound</button>
          <button id="modeMouse" class="mode-btn" data-mode="mouse">Mouse</button>
        </div>
      </div>

      <div class="control-section">
        <label for="speedSlider">Speed:</label>
        <div class="slider-container">
          <input type="range" id="speedSlider" min="0" max="1" step="0.01" value="0.5" class="slider">
          <span id="speedValue">0.50</span>
        </div>
      </div>

      <div class="control-section">
        <label for="micStatus">Microphone:</label>
        <div class="mic-status">
          <div id="micIndicator" class="mic-indicator off"></div>
          <span id="micStatusText">Ready</span>
        </div>
      </div>

      <div class="control-section">
        <label class="file-upload" for="audioFile">
          <span class="file-upload-text">Upload File</span>
          <input type="file" id="audioFile" accept="audio/*" class="file-input">
        </label>
      </div>

      <div class="control-separator"></div>

      <div class="button-group">
        <button id="startBtn" class="btn btn-primary">START</button>
        <button id="stopBtn" class="btn btn-secondary" disabled>STOP</button>
        <button id="clearBtn" class="btn btn-secondary" disabled>CLEAR</button>
      </div>

      <div class="button-group">
        <button id="invertBtn" class="btn btn-invert">INVERT</button>
        <button id="exportBtn" class="btn btn-export" disabled>EXPORT PNG</button>
      </div>

      <div class="control-separator"></div>

      <div class="footer">
        <a href="../../000-inicio/" class="back-link">Back</a>
        <div id="timestamp" class="timestamp"></div>
      </div>
    </div>

    <div id="sketch-holder" class="canvas-container"></div>
  </div>

  <script src="js/sketch.js"></script>
</body>
</html>
