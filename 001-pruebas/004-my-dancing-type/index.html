<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Noto Sans', 'Noto Sans Condensed', sans-serif;
    }

    .back-button {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 2.5rem;
      min-height: 2.5rem;
      width: 180px;
      max-width: 180px;
      min-width: 80px;
      padding: 0 0.45rem;
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      text-decoration: none;
      font-family: 'Noto Sans', 'Noto Sans Condensed', sans-serif;
      font-size: 0.9rem;
      line-height: 1;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.35rem;
      backdrop-filter: blur(8px);
      box-sizing: border-box;
    }

    .back-button:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    button, select, input, textarea {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 2.5rem;
      min-height: 2.5rem;
      padding: 0 0.45rem;
      width: auto;
      max-width: 180px;
      min-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-family: 'Noto Sans', 'Noto Sans Condensed', sans-serif;
      font-size: 0.9rem;
      line-height: 1;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.35rem;
      backdrop-filter: blur(8px);
      cursor: pointer;
      box-sizing: border-box;
    }

    input, textarea {
      cursor: text;
      padding-left: 0.9rem;
      text-align: left;
      white-space: normal;
    }

    input::placeholder, textarea::placeholder {
      color: rgba(255, 255, 255, 0.65);
    }

    .text-textarea {
      display: block;
      height: 4.5rem;
      min-height: 3.5rem;
      max-height: 10rem;
      padding: 0.5rem 0.9rem;
      line-height: 1.3;
      white-space: pre-wrap;
      overflow-x: hidden;
      overflow-y: auto;
      text-overflow: clip;
      resize: vertical;
      font-family: 'Noto Sans', 'Noto Sans Condensed', sans-serif;
    }

    button:hover, select:hover {
      background: rgba(0, 0, 0, 0.85);
    }

    .color-dropdown-button {
      min-width: 180px;
      text-align: left;
      padding-right: 1.2rem;
      position: relative;
    }

    .color-dropdown-button::after {
      content: "▾";
      position: absolute;
      right: 0.9rem;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
    }

    .color-palette {
      display: grid;
      grid-template-columns: repeat(8, 28px);
      gap: 6px;
      padding: 10px;
      width: min(280px, calc(100vw - 40px));
      max-height: 210px;
      overflow-y: auto;
      position: fixed;
      left: 20px;
      top: 260px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 0.6rem;
      backdrop-filter: blur(10px);
      z-index: 1000;
    }
    .color-swatch {
      width: 100%;
      aspect-ratio: 1 / 1;
      min-height: 28px;
    }

    .option-palette {
      display: grid;
      grid-template-columns: repeat(2, minmax(140px, 1fr));
      gap: 10px;
      padding: 12px;
      width: min(380px, calc(100vw - 40px));
      max-height: 240px;
      overflow-y: auto;
      position: fixed;
      left: 20px;
      top: 260px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 0.75rem;
      backdrop-filter: blur(12px);
      z-index: 1000;
    }

    .size-palette {
      grid-template-columns: 1fr;
    }

    .color-swatch,
    .option-item {
      border-radius: 0.35rem;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-sizing: border-box;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .option-item {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: auto;
      height: 2.5rem;
      padding: 0 0.75rem;
      white-space: nowrap;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.95rem;
      color: #fff;
    }

    .option-palette input[type="range"] {
      width: 100%;
      margin: 0.2rem 0 0.4rem;
      accent-color: #ffffff;
    }

    .option-palette input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      border: 1px solid rgba(0, 0, 0, 0.35);
    }

    .option-palette input[type="range"]::-webkit-slider-runnable-track {
      height: 5px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.25);
    }

    .option-item.selected {
      border-color: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.12);
    }

    .option-item:hover,
    .color-swatch:hover {
      transform: translateY(-1px);
      border-color: rgba(255, 255, 255, 0.95);
    }

    .option-item:hover,
    .color-swatch:hover {
      transform: translateY(-1px);
    }

    .color-swatch:hover {
      transform: translateY(-1px);
    }

    .color-swatch.selected {
      border-color: rgba(255, 255, 255, 0.95);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.18);
    }

    .control-separator {
      width: 100%;
      max-width: 180px;
      height: 1px;
      background: rgba(255, 255, 255, 0.95);
      margin-top: 10px;
      margin-bottom: 20px;
      align-self: flex-start;
    }
  </style>
</head>
<body>
  <a class="back-button" href="../../000-inicio/">← Back to Index</a>
  <script src="sketch.js"></script>
</body>
</html>
