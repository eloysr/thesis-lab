<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #141414;
    }

    .back-button {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 2.5rem;
      white-space: nowrap;
      padding: 0 0.9rem;
      background: rgba(74, 58, 58, 0.2);
      color: #fff;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 0.9rem;
      line-height: 1;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 0.35rem;
      backdrop-filter: blur(8px);
      box-sizing: border-box;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* botón específico para acciones destructivas / secundarias */
    .back-button.limpiar-button {
      background: rgba(0, 0, 0, 0.8);
      border-color: rgba(255,255,255,0.08);
      color: #fff;
    }

    .back-button.limpiar-button:hover {
      background: rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body>
  <a class="back-button limpiar-button" href="../../000-inicio/">← Volver</a>
  <script src="sketch.js"></script>
</body>
</html>
