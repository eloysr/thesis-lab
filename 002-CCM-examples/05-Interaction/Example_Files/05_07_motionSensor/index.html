<!--
    p5.js iOS Motion Sensor
    This HTML file loads styles, libraries, and the project files.
    The canvas itself is created dynamically in js/sketch.js.
  -->

<!doctype html>
<html lang="en">

<head>

  <!-- Basic document metadata and responsive behavior. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Browser tab title. -->
  <title>p5.js Motion Sensor</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="css/style.css" />

  <!-- External libraries -->
  <script src="libraries/p5.js"></script>

  <!-- Project files -->
  <script src="js/sketch.js"></script>

</head>

<body>
  <!-- Permission overlay — visible until the user grants motion access. -->
  <div id="permission-overlay">
    <button id="permission-btn" onclick="requestMotionPermission()">
      Enable Motion Sensor
    </button>
  </div>
</body>

</html>
